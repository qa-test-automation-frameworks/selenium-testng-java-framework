name: UI Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_accessibility:
        description: 'Run the optional accessibility smoke suite'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 6 1 1,4,7,10 *'

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unsupported-java-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up unsupported JDK 17 for the rejection control
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Require Maven Enforcer to reject unsupported JDK 17
        shell: bash
        run: |
          if output=$(./mvnw -B validate 2>&1); then
            echo 'Maven unexpectedly accepted unsupported JDK 17.'
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F 'RequireJavaVersion' <<< "$output"
          grep -F 'not in the allowed range [21,)' <<< "$output"

  fresh-clone-bootstrap:
    # Prove the documented no-secret first-success command with no Maven dependency cache.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 21 without Maven caching
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Run the documented unit first-success path in an empty Maven repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          cold_repo="$RUNNER_TEMP/m2-cold"
          test ! -e "$cold_repo"
          started=$(date +%s)
          ./mvnw -B -ntp -C \
            -Dmaven.repo.local="$cold_repo" \
            -Dtestng.suite.file=testng-framework-unit.xml verify 2>&1 | tee target/fresh-clone-bootstrap.log
          elapsed=$(($(date +%s) - started))
          python3 - "$elapsed" <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          elapsed = int(sys.argv[1])
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for filename in glob.glob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(filename).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.get(key, "0"))
          if totals["tests"] == 0 or totals["failures"] or totals["errors"]:
              raise SystemExit(f"Fresh-bootstrap reports did not prove a passing test run: {totals}")
          summary = (
              "## Fresh-clone Maven bootstrap\n\n"
              f"- Command: `./mvnw -B -ntp -C -Dmaven.repo.local=$RUNNER_TEMP/m2-cold "
              "-Dtestng.suite.file=testng-framework-unit.xml verify`\n"
              f"- Elapsed: {elapsed} seconds with an empty isolated Maven repository\n"
              f"- Native Surefire totals: {totals['tests']} tests, {totals['failures']} failures, "
              f"{totals['errors']} errors, {totals['skipped']} skipped\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write(summary)
          print(summary)
          PY

      - name: Preserve cold-bootstrap log and native Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selenium-fresh-clone-bootstrap
          path: |
            target/fresh-clone-bootstrap.log
            target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Validate Maven wrapper distribution
        run: grep -Fxq 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.15/apache-maven-3.9.15-bin.zip' .mvn/wrapper/maven-wrapper.properties

      - name: Start native evidence window
        run: |
          rm -f target/surefire-reports/TEST-*.xml target/portfolio-metrics-v1.json
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run compiled framework quality gate
        id: native-tests
        run: |
          mkdir -p target
          set +e
          ./mvnw -Dtestng.suite.file=testng-framework-unit.xml verify 2>&1 | tee target/framework-quality.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Summarize framework unit failures
        if: always() && steps.native-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          findings = []
          for filename in glob.glob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(filename).getroot()
              for case in root.iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      message = (failure.get("message") or failure.text or "no failure message").strip()
                      detail = f"{case.get('classname')}#{case.get('name')}: {message}"
                      findings.append(detail.replace("\r", " ").replace("\n", " ")[:1000])
          if findings:
              lines = findings
          else:
              lines = ["The Maven quality gate failed without a Surefire testcase failure record."]
              try:
                  with open("target/framework-quality.log", encoding="utf-8", errors="replace") as stream:
                      tail = [line.rstrip() for line in stream.readlines()[-35:] if line.strip()]
                  if tail:
                      lines.append("Maven log tail: " + " | ".join(tail)[:1800])
              except OSError:
                  pass
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("## Framework unit failure details\n\n")
                  stream.writelines(f"- {line}\n" for line in lines)
          for line in lines:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Framework unit failure::{escaped}")
          PY

      - name: Publish formatter patch after a Spotless failure
        if: always() && steps.native-tests.outcome == 'failure'
        run: |
          if ! grep -q 'spotless-maven-plugin.*check' target/framework-quality.log; then exit 0; fi
          set +e
          ./mvnw spotless:apply > target/spotless-apply.log 2>&1
          apply_status=$?
          set -e
          {
            echo '## Spotless formatter patch (diagnostic only)'
            echo
            echo "Formatter exit status: $apply_status"
            echo
            echo '```diff'
            git diff -- src/test/java
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import os
          import subprocess

          result = subprocess.run(
              ["git", "diff", "--", "src/test/java"], check=True, text=True, capture_output=True
          )
          patch = result.stdout[:12000]
          message = patch.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::warning title=Spotless formatter diff::{message or 'No source diff produced.'}")
          PY

      - name: Emit framework quality evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          GITHUB_WORKFLOW: UI Tests
          SCOPE_ID: framework-quality
          COUNT_UNIT: test_case
          EVIDENCE_CLASS: hermetic
          TARGET_ID: selenium-framework-unit
          TARGET_REVISION: ${{ github.sha }}
          TARGET_ENVIRONMENT: ci-hermetic
          TARGET_PROFILE: framework-unit
          FRESHNESS_POLICY: quarterly_experiment_v1
          SCOPE_REQUIRED: 'true'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JAVA_VERSION: '21'
          MAVEN_VERSION: '3.9.15'
          SELENIUM_VERSION: '4.39.0'
          TESTNG_VERSION: '7.12.0'
        run: |
          set +e
          export COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/emit_evidence.py
          emit_status=$?
          node scripts/validate-evidence.mjs target/portfolio-evidence/evidence-v3.json
          validate_status=$?
          if [ "$emit_status" -ne 0 ] || [ "$validate_status" -ne 0 ]; then exit 1; fi

      - name: Upload framework quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-framework-quality
          path: target/portfolio-evidence/evidence-v3.json
          if-no-files-found: error

      - name: Upload framework native XML summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports-framework-quality
          path: |
            target/surefire-reports/TEST-*.xml
            target/framework-quality.log
          if-no-files-found: error

      - name: Verify quality-gate inputs and reports
        shell: bash
        run: |
          set -euo pipefail
          test -d target/classes
          test -d target/test-classes
          test -f target/checkstyle-result.xml
          test -f target/pmd.xml
          test -f target/spotbugsXml.xml
          test -f target/portfolio-metrics-v1.json

  dependency-governance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Validate Maven wrapper distribution
        run: grep -Fxq 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.15/apache-maven-3.9.15-bin.zip' .mvn/wrapper/maven-wrapper.properties

      - name: Generate dependency update report
        run: |
          mkdir -p target/dependency-governance
          ./mvnw versions:display-dependency-updates -Dmaven.version.rules=file://$PWD/config/versions/rules.xml > target/dependency-governance/dependency-updates.txt
          ./mvnw versions:display-plugin-updates -Dmaven.version.rules=file://$PWD/config/versions/rules.xml > target/dependency-governance/plugin-updates.txt

      - name: Upload dependency update reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-update-reports
          path: target/dependency-governance/*.txt

      - name: Generate SBOM
        run: ./mvnw -Psbom -DskipTests verify

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyclonedx-sbom
          path: target/*bom*.*

  evidence-failure-control:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Validate Maven wrapper distribution
        run: grep -Fxq 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.15/apache-maven-3.9.15-bin.zip' .mvn/wrapper/maven-wrapper.properties

      - name: Start controlled failure run
        run: |
          rm -f target/surefire-reports/TEST-*.xml target/portfolio-metrics-v1.json
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run intentional TestNG failure control
        id: controlled-failure
        continue-on-error: true
        run: ./mvnw -Dtestng.suite.file=testng-evidence-failure-control.xml test

      - name: Emit and validate negative evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.controlled-failure.outcome }}
          GITHUB_WORKFLOW: UI Tests
          SCOPE_ID: evidence-negative-control
          COUNT_UNIT: test_case
          EVIDENCE_CLASS: hermetic
          # required-ci enforces this control; it is optional only in the evidence freshness aggregate.
          SCOPE_REQUIRED: 'false'
          TARGET_ID: selenium-evidence-control
          TARGET_REVISION: ${{ github.sha }}
          TARGET_ENVIRONMENT: ci-hermetic
          TARGET_PROFILE: controlled-failure
          FRESHNESS_POLICY: quarterly_experiment_v1
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JAVA_VERSION: '21'
          MAVEN_VERSION: '3.9.15'
          SELENIUM_VERSION: '4.39.0'
          TESTNG_VERSION: '7.12.0'
        run: |
          set +e
          export COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/emit_evidence.py
          emit_status=$?
          node scripts/validate-evidence.mjs target/portfolio-evidence/evidence-v3.json
          schema_status=$?
          python3 scripts/verify_negative_evidence.py target/portfolio-evidence/evidence-v3.json target/surefire-reports "$GITHUB_RUN_ID" "$GITHUB_SHA"
          verify_status=$?
          if [ "$emit_status" -ne 0 ] || [ "$schema_status" -ne 0 ] || [ "$verify_status" -ne 0 ]; then exit 1; fi

      - name: Upload negative-control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-negative-control
          path: target/portfolio-evidence/evidence-v3.json
          if-no-files-found: error

      - name: Upload negative-control native XML summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports-negative-control
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error

  test:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [CHROME, FIREFOX, EDGE]

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Validate Maven wrapper distribution
        run: grep -Fxq 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.15/apache-maven-3.9.15-bin.zip' .mvn/wrapper/maven-wrapper.properties

      - name: Start Selenium Grid
        shell: bash
        run: |
          set -euo pipefail
          browser_service="$(echo "${{ matrix.browser }}" | tr '[:upper:]' '[:lower:]')"

          if [[ "$browser_service" == "edge" ]]; then
            docker compose --profile edge up -d selenium-hub edge
          else
            docker compose up -d selenium-hub "$browser_service"
          fi

          deadline=$((SECONDS + 120))
          until curl -sf http://localhost:4444/status | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; do
            if (( SECONDS >= deadline )); then
              curl -sf http://localhost:4444/status || true
              docker compose ps
              docker compose logs --no-color selenium-hub "$browser_service"
              exit 1
            fi
            sleep 2
          done

      - name: Validate required secrets for trusted full regression
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: test -n "$APP_PASSWORD"
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      - name: Run UI tests
        id: native-tests
        run: |
          rm -f target/surefire-reports/TEST-*.xml target/portfolio-metrics-v1.json
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          TEST_STATUS=0
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            export APP_USERNAME=standard_user
            ./mvnw clean test -Dgroups=inventory,cart -Dbrowser=${{ matrix.browser }} -Dheadless=true -Dthread.count=2 -Dexecution.type=remote -Dremote.url=http://localhost:4444/wd/hub -Dallure.issue.pattern=https://github.com/${{ github.repository }}/issues/{} || TEST_STATUS=$?
          else
            export APP_USERNAME=standard_user
            ./mvnw clean test -Dbrowser=${{ matrix.browser }} -Dheadless=true -Dthread.count=2 -Dexecution.type=remote -Dremote.url=http://localhost:4444/wd/hub -Dallure.issue.pattern=https://github.com/${{ github.repository }}/issues/{} || TEST_STATUS=$?
          fi
          ./mvnw allure:report -DskipTests -Dallure.issue.pattern=https://github.com/${{ github.repository }}/issues/{} || true
          exit $TEST_STATUS
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

      - name: Emit browser-matrix evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          GITHUB_WORKFLOW: UI Tests
          SCOPE_ID: ui.${{ matrix.browser }}
          BROWSER: ${{ matrix.browser }}
          EVIDENCE_CLASS: controlled
          TARGET_ID: saucedemo-public-demo
          TARGET_ENVIRONMENT: public-demo
          FRESHNESS_POLICY: quarterly_experiment_v1
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JAVA_VERSION: '21'
          MAVEN_VERSION: '3.9.15'
          SELENIUM_VERSION: '4.39.0'
          TESTNG_VERSION: '7.12.0'
        run: |
          set +e
          export COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/emit_evidence.py
          emit_status=$?
          node scripts/validate-evidence.mjs target/portfolio-evidence/evidence-v3.json
          validate_status=$?
          if [ "$emit_status" -ne 0 ] || [ "$validate_status" -ne 0 ]; then exit 1; fi

      - name: Upload browser-matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-ui-${{ matrix.browser }}
          path: target/portfolio-evidence/evidence-v3.json
          if-no-files-found: error

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results/

      - name: Upload generated Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-report-${{ matrix.browser }}
          path: target/allure-report/

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports/

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: execution-logs-${{ matrix.browser }}
          path: target/logs/

      - name: Upload runtime metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-metrics-${{ matrix.browser }}
          path: target/portfolio-metrics-v1.json

      - name: Tear down Selenium Grid
        if: always()
        run: docker compose down --remove-orphans

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## UI test job summary"
            echo
            echo "- Browser matrix entry: ${{ matrix.browser }}"
            echo "- Event: ${{ github.event_name }}"
            echo "- Run mode: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'public no-secret smoke' || 'trusted full regression' }}"
            echo "- Allure results artifact: allure-results-${{ matrix.browser }}"
            echo "- Allure report artifact: allure-report-${{ matrix.browser }}"
          } >> "$GITHUB_STEP_SUMMARY"

  accessibility:
    needs: quality-gates
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_accessibility == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Validate Maven wrapper distribution
        run: grep -Fxq 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.15/apache-maven-3.9.15-bin.zip' .mvn/wrapper/maven-wrapper.properties

      - name: Start Selenium Grid
        run: |
          docker compose up -d selenium-hub chrome
          deadline=$((SECONDS + 120))
          until curl -sf http://localhost:4444/status | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; do
            if (( SECONDS >= deadline )); then
              curl -sf http://localhost:4444/status || true
              docker compose ps
              docker compose logs --no-color selenium-hub chrome
              exit 1
            fi
            sleep 2
          done

      - name: Run synthetic DOM protection on Chrome
        id: diagnostics-control
        continue-on-error: true
        run: >-
          ./mvnw -B -ntp
          -Dtestng.suite.file=testng-diagnostics-browser.xml
          -Dexecution.type=remote
          -Dremote.url=http://localhost:4444/wd/hub
          -Dbrowser=CHROME -Dheadless=true -Dthread.count=1 test

      - name: Upload synthetic DOM protection result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-protection-chrome-control
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Run accessibility smoke suite
        id: native-tests
        run: |
          rm -f target/surefire-reports/TEST-*.xml target/portfolio-metrics-v1.json
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          TEST_STATUS=0
          ./mvnw clean test -Dtestng.suite.file=testng-accessibility.xml -Dgroups=accessibility -Dbrowser=CHROME -Dheadless=true -Dthread.count=1 -Dexecution.type=remote -Dremote.url=http://localhost:4444/wd/hub -Dallure.issue.pattern=https://github.com/${{ github.repository }}/issues/{} || TEST_STATUS=$?
          ./mvnw allure:report -DskipTests -Dallure.issue.pattern=https://github.com/${{ github.repository }}/issues/{} || true
          exit $TEST_STATUS

      - name: Emit accessibility evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          GITHUB_WORKFLOW: UI Tests
          SCOPE_ID: accessibility.CHROME
          BROWSER: CHROME
          EVIDENCE_CLASS: controlled
          TARGET_ID: saucedemo-public-demo
          TARGET_ENVIRONMENT: public-demo
          FRESHNESS_POLICY: quarterly_experiment_v1
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JAVA_VERSION: '21'
          MAVEN_VERSION: '3.9.15'
          SELENIUM_VERSION: '4.39.0'
          TESTNG_VERSION: '7.12.0'
          TARGET_PROFILE: accessibility
        run: |
          set +e
          export COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/emit_evidence.py
          emit_status=$?
          node scripts/validate-evidence.mjs target/portfolio-evidence/evidence-v3.json
          validate_status=$?
          if [ "$emit_status" -ne 0 ] || [ "$validate_status" -ne 0 ]; then exit 1; fi

      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-accessibility-CHROME
          path: target/portfolio-evidence/evidence-v3.json
          if-no-files-found: error

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-results-accessibility
          path: target/allure-results/

      - name: Upload generated Allure report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: allure-report-accessibility
          path: target/allure-report/

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports-accessibility
          path: target/surefire-reports/

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: execution-logs-accessibility
          path: target/logs/

      - name: Require the synthetic DOM protection result
        if: always()
        env:
          CONTROL_OUTCOME: ${{ steps.diagnostics-control.outcome }}
        run: |
          if [ "$CONTROL_OUTCOME" != success ]; then
            echo "The synthetic DOM protection control did not pass." >&2
            exit 1
          fi

      - name: Tear down Selenium Grid
        if: always()
        run: docker compose down --remove-orphans

      - name: Publish accessibility job summary
        if: always()
        run: |
          {
            echo "## Accessibility smoke summary"
            echo
            echo "- Event: ${{ github.event_name }}"
            echo "- Browser: CHROME"
            echo "- Suite file: testng-accessibility.xml"
            echo "- Allure results artifact: allure-results-accessibility"
            echo "- Allure report artifact: allure-report-accessibility"
          } >> "$GITHUB_STEP_SUMMARY"

  grid-capacity-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Start pinned single-node Chrome Grid
        run: |
          docker compose up -d selenium-hub chrome
          deadline=$((SECONDS + 120))
          until curl -sf http://localhost:4444/status | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; do
            if (( SECONDS >= deadline )); then
              docker compose ps
              docker compose logs --no-color selenium-hub chrome
              exit 1
            fi
            sleep 2
          done
          chrome_container="$(docker compose ps -q chrome)"
          memory_limit="$(docker inspect --format '{{.HostConfig.Memory}}' "$chrome_container")"
          shared_memory="$(docker inspect --format '{{.HostConfig.ShmSize}}' "$chrome_container")"
          test "$memory_limit" -ge 2147483648
          test "$shared_memory" -ge 2147483648
          echo "GRID_MEMORY_LIMIT_BYTES=$memory_limit" >> "$GITHUB_ENV"
          echo "GRID_SHARED_MEMORY_BYTES=$shared_memory" >> "$GITHUB_ENV"

      - name: Run bounded one, two, and four worker samples
        run: ./mvnw -Dtestng.suite.file=testng-grid-capacity.xml -Dexecution.type=remote -Dremote.url=http://localhost:4444/wd/hub -Dbrowser=CHROME -Dheadless=true test

      - name: Upload Grid capacity sample
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selenium-grid-capacity-sample
          path: target/grid-capacity-sample.json
          if-no-files-found: error

      - name: Publish Grid sample in workflow summary
        if: always() && hashFiles('target/grid-capacity-sample.json') != ''
        run: |
          {
            echo "## Bounded Selenium Grid sample"
            echo
            cat target/grid-capacity-sample.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Grid
        if: always()
        run: docker compose down --remove-orphans

  required-ci:
    # One stable check fails closed if any required matrix leg or quality gate is skipped/missing.
    needs: [unsupported-java-runtime, fresh-clone-bootstrap, quality-gates, evidence-failure-control, test, accessibility, grid-capacity-experiment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JAVA_RUNTIME_RESULT: ${{ needs.unsupported-java-runtime.result }}
      BOOTSTRAP_RESULT: ${{ needs.fresh-clone-bootstrap.result }}
      QUALITY_RESULT: ${{ needs.quality-gates.result }}
      MATRIX_RESULT: ${{ needs.test.result }}
      ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
      GRID_CAPACITY_RESULT: ${{ needs.grid-capacity-experiment.result }}
      FAILURE_CONTROL_RESULT: ${{ needs.evidence-failure-control.result }}
      EVENT_NAME: ${{ github.event_name }}
      ACCESSIBILITY_REQUESTED: ${{ inputs.run_accessibility }}
    steps:
      - name: Enforce mandatory scopes
        shell: bash
        run: |
          set -euo pipefail
          test "$JAVA_RUNTIME_RESULT" = success
          test "$BOOTSTRAP_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$FAILURE_CONTROL_RESULT" = success
          test "$MATRIX_RESULT" = success
          test "$GRID_CAPACITY_RESULT" = success
          if [[ "$EVENT_NAME" == schedule || ( "$EVENT_NAME" == workflow_dispatch && "$ACCESSIBILITY_REQUESTED" == true ) ]]; then
            test "$ACCESSIBILITY_RESULT" = success
          fi

  publish-allure-report:
    needs: [test, accessibility, required-ci]
    # Publish even on failed tests so the latest failure diagnostics remain inspectable.
    if: always() && github.ref == 'refs/heads/main' && (needs.test.result != 'skipped' || needs.accessibility.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw

      - name: Validate Maven wrapper distribution
        run: grep -Fxq 'distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.15/apache-maven-3.9.15-bin.zip' .mvn/wrapper/maven-wrapper.properties

      - name: Download Allure results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true

      - name: Validate downloaded Allure results
        shell: bash
        run: |
          if ! find target/allure-results -name '*-result.json' -print -quit | grep -q .; then
            echo "No Allure result files were downloaded; skipping Pages publication."
            exit 1
          fi

      - name: Restore Allure history cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Attach previous Allure history
        shell: bash
        run: |
          if [[ -d target/allure-history/history ]]; then
            mkdir -p target/allure-results/history
            cp -R target/allure-history/history/. target/allure-results/history/
          fi

      - name: Generate Allure report
        run: ./mvnw allure:report -DskipTests -Dallure.issue.pattern=https://github.com/${{ github.repository }}/issues/{}

      - name: Preserve Allure history
        shell: bash
        run: |
          rm -rf target/allure-history
          mkdir -p target/allure-history
          if [[ -d target/allure-report/history ]]; then
            cp -R target/allure-report/history target/allure-history/history
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  notify-scheduled-failure:
    needs: [test, accessibility, publish-allure-report]
    if: always() && github.event_name == 'schedule' && (needs.test.result == 'failure' || needs.accessibility.result == 'failure' || needs.publish-allure-report.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      TEST_RESULT: ${{ needs.test.result }}
      ACCESSIBILITY_RESULT: ${{ needs.accessibility.result }}
      PUBLISH_RESULT: ${{ needs.publish-allure-report.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_TITLE: Scheduled UI regression failure
    steps:
      - name: Open or update scheduled failure issue
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const body = [
              'A scheduled UI regression run failed.',
              '',
              `- Workflow run: ${process.env.RUN_URL}`,
              `- Test job result: ${process.env.TEST_RESULT}`,
              `- Accessibility job result: ${process.env.ACCESSIBILITY_RESULT}`,
              `- Publish job result: ${process.env.PUBLISH_RESULT}`,
              `- Commit: ${context.sha}`,
              `- Triggered at: ${new Date().toISOString()}`,
            ].join('\n');

            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scheduled-failure',
              per_page: 100,
            });

            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Updated existing scheduled failure issue #${existing.number}`);
              return;
            }

            const {data: issue} = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci', 'scheduled-failure'],
            });
            core.notice(`Created scheduled failure issue #${issue.number}`);
