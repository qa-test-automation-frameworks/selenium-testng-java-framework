name: Publish trusted portfolio evidence

on:
  workflow_run:
    workflows:
      - UI Tests
      - Cloud Grid Smoke
      - Shared reference app UI
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)
    uses: qa-test-automation-frameworks/.github/.github/workflows/publish-evidence.yml@7960801249c036ef56370f54abdf79570b5a7bd8
    with:
      source-run-id: ${{ github.event.workflow_run.id }}
      workflow-file: ${{ github.event.workflow_run.name == 'UI Tests' && '.github/workflows/ui-tests.yml' || github.event.workflow_run.name == 'Cloud Grid Smoke' && '.github/workflows/cloud-grid.yml' || '.github/workflows/shared-reference-app-ui.yml' }}
